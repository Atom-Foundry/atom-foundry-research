<line x1="130" y1="520" x2="1000" y2="520" stroke="#938f81"/><line x1="130" y1="150" x2="130" y2="520" stroke="#938f81"/><text x="565" y="590" text-anchor="middle" font-family="Arial" font-size="15" fill="#4a463c">Real-world baseline recommendation rate →</text><text x="35" y="340" transform="rotate(-90 35 340)" text-anchor="middle" font-family="Arial" font-size="15" fill="#4a463c">Hidden-context lift</text><text x="565" y="190" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fe6a03">r = -0.63</text><text x="565" y="220" text-anchor="middle" font-family="Arial" font-size="15" fill="#4a463c">Candidacy lift · exploratory · n=5</text><text x="565" y="270" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fe6a03">r = -0.73</text><text x="565" y="300" text-anchor="middle" font-family="Arial" font-size="15" fill="#4a463c">Winner lift · exploratory · n=5</text><text x="565" y="390" text-anchor="middle" font-family="Arial" font-size="16" fill="#4a463c">Negative correlation means brands with lower starting baselines showed more room to move.</text>
